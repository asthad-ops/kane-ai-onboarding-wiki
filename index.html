<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaneAI Onboarding Wiki</title>
<style>
  :root{
    --paper:#f6f5f2; --panel:#ffffff; --ink:#1c2024; --ink-soft:#565d66; --line:#e1dfd9;
    --signal:#1f5fbf; --signal-soft:#e8f0fc; --green:#0e6e55; --green-soft:#e4f2ed;
    --red:#a8341a; --red-soft:#faece5;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; --sans:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;}
  .shell{display:grid; grid-template-columns:300px 1fr; min-height:100vh;}
  aside{background:var(--panel); border-right:1px solid var(--line); padding:22px 18px; position:sticky; top:0; height:100vh; overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  .brand{font-family:var(--mono); font-size:11px; letter-spacing:0.02em; color:var(--signal); margin-bottom:2px;}
  h1.title{font-size:16px; margin:0 0 10px 0; font-weight:650; letter-spacing:-0.01em;}
  .edit-toggle{display:flex; align-items:center; justify-content:space-between; padding:6px 9px; border-radius:6px; background:var(--paper); border:1px solid var(--line); margin-bottom:6px; cursor:pointer; user-select:none; flex-shrink:0;}
  .edit-toggle.on{background:var(--green-soft); border-color:var(--green);}
  .edit-toggle .label{font-size:12px; font-weight:600;}
  .edit-toggle.on .label{color:var(--green);}
  .switch{width:28px; height:16px; border-radius:9px; background:var(--line); position:relative; flex-shrink:0;}
  .switch::after{content:""; position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left 0.15s ease; box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .edit-toggle.on .switch{background:var(--green);}
  .edit-toggle.on .switch::after{left:14px;}
  .btn-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-bottom:6px; flex-shrink:0;}
  .btn-row .btn.add{grid-column:1 / -1;}
  .btn-row .btn.primary{grid-column:1 / -1;}
  .btn{font-family:var(--sans); font-size:10.5px; font-weight:600; padding:6px 6px; border-radius:5px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; text-align:center;}
  .btn:hover{background:var(--paper);}
  .btn.primary{background:var(--signal); color:#fff; border-color:var(--signal);}
  .btn.primary:hover{opacity:0.92;}
  .btn.add{background:var(--green-soft); border-color:var(--green); color:var(--green);}
  .save-status{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin-bottom:6px; min-height:12px; flex-shrink:0;}
  .search-box{position:relative; margin-bottom:6px; flex-shrink:0;}
  .search-box input{width:100%; padding:6px 9px 6px 26px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--sans); background:var(--paper); color:var(--ink);}
  .search-box input:focus{outline:none; border-color:var(--signal); background:var(--panel);}
  .search-box svg{position:absolute; left:8px; top:7px; width:12px; height:12px; stroke:var(--ink-soft);}
  .toc-label{font-family:var(--mono); font-size:10px; color:var(--ink-soft); margin:2px 0 4px 0; flex-shrink:0;}
  .tree{flex:1 1 0; min-height:0; overflow-y:auto; padding-bottom:6px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:2px 0;}
  .tree-item{display:flex; align-items:center; justify-content:space-between; gap:4px; border-radius:5px; margin-bottom:1px; cursor:grab; border-top:2px solid transparent; border-bottom:2px solid transparent;}
  .tree-item.dragging{opacity:0.4;}
  .tree-item.drop-before{border-top:2px solid var(--signal);}
  .tree-item.drop-after{border-bottom:2px solid var(--signal);}
  .tree-item:hover{background:var(--paper);}
  .tree-item.active{background:var(--signal-soft);}
  .tree-item a{flex:1; font-size:12.5px; color:var(--ink); text-decoration:none; padding:6px 6px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tree-item.child a{padding-left:20px; font-size:12px; color:var(--ink-soft);}
  .tree-item.active a{color:var(--signal); font-weight:600;}
  .del-btn{display:none; background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; padding:2px 6px; line-height:1;}
  body.editing .del-btn{display:block;}
  .meta-note{font-size:10.5px; color:var(--ink-soft); line-height:1.5; margin-top:6px; flex-shrink:0;}
  main{padding:44px 56px 100px; max-width:840px;}
  .breadcrumb{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;}
  .breadcrumb a{color:var(--signal); text-decoration:none;}
  .page-title{font-size:26px; font-weight:700; margin:0 0 20px 0; letter-spacing:-0.015em; outline:none;}
  .page-title[contenteditable="true"]{outline:2px dashed var(--signal); outline-offset:6px; border-radius:6px; padding:4px 6px;}
  .edit-toolbar{display:none; gap:8px; margin-bottom:14px;}
  .edit-toolbar.show{display:flex;}
  .toolbar-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .toolbar-btn:hover{background:var(--signal-soft); border-color:var(--signal); color:var(--signal);}
  .toolbar-btn:disabled{opacity:0.5; cursor:wait;}
  .content{font-size:15px; color:var(--ink); margin-bottom:32px;}
  .content[contenteditable="true"]{outline:2px dashed var(--signal); outline-offset:8px; border-radius:6px; padding:8px 8px 8px 0; background:rgba(31,95,191,0.02); min-height:60px;}
  .content p{margin:0 0 12px 0;}
  .content ul, .content ol{margin:0 0 12px 0; padding-left:22px;}
  .content li{margin-bottom:6px;}
  .content strong{font-weight:650;}
  .content code{font-family:var(--mono); font-size:0.87em; background:var(--paper); padding:1px 5px; border-radius:4px; border:1px solid var(--line);}
  .content img{max-width:100%; border-radius:8px; border:1px solid var(--line); margin:6px 0 14px 0; display:block;}
  .content a.file-attachment{display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line); padding:6px 12px; border-radius:6px; text-decoration:none; color:var(--ink); font-size:13.5px; margin:4px 0;}
  .content a.file-attachment:hover{border-color:var(--signal); color:var(--signal);}
  .content pre{font-family:var(--mono); font-size:12.5px; background:var(--ink); color:#e8e6e1; padding:14px 16px; border-radius:7px; overflow-x:auto; margin:0 0 14px 0; line-height:1.6;}
  .content table{border-collapse:collapse; width:100%; margin:0 0 16px 0; font-size:13.5px;}
  .content th, .content td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top;}
  .content th{background:var(--paper); font-weight:650; font-family:var(--mono); font-size:11.5px;}
  .children-section{border-top:1px solid var(--line); padding-top:22px;}
  .children-label{font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin:0 0 12px 0; display:flex; justify-content:space-between; align-items:center;}
  .children-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .child-card{border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--panel); text-decoration:none; color:var(--ink); display:block; position:relative;}
  .child-card:hover{border-color:var(--signal); background:var(--signal-soft);}
  .child-card .ct{font-size:13.5px; font-weight:600;}
  .child-card .del-child{position:absolute; top:8px; right:8px; display:none; background:none; border:none; color:var(--red); cursor:pointer; font-size:14px;}
  body.editing .child-card .del-child{display:block;}
  .empty-state{color:var(--ink-soft); font-size:13.5px; font-style:italic; padding:20px 0;}
  .toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:7px; font-size:13px; font-family:var(--sans); opacity:0; transform:translateY(8px); transition:all 0.2s ease; pointer-events:none; z-index:999;}
  .toast.show{opacity:1; transform:translateY(0);}
  .modal-overlay{position:fixed; inset:0; background:rgba(28,32,36,0.4); display:none; align-items:center; justify-content:center; z-index:998;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--panel); border-radius:10px; padding:24px; width:380px; max-width:90vw; box-shadow:0 10px 40px rgba(0,0,0,0.2);}
  .modal h3{margin:0 0 14px 0; font-size:16px;}
  .modal label{display:block; font-size:12.5px; font-weight:600; margin:12px 0 5px 0;}
  .modal input, .modal select{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; font-family:var(--sans);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    aside{position:relative; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    main{padding:30px 20px 70px;}
    .children-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">ONBOARDING WIKI</div>
    <h1 class="title">KaneAI Guide</h1>
    <div class="edit-toggle" id="editToggle">
      <span class="label">Edit mode</span>
      <span class="switch"></span>
    </div>
    <div class="btn-row">
      <button class="btn add" id="addPageBtn">+ Add page</button>
      <button class="btn primary" id="saveBtn">Save changes</button>
      <button class="btn" id="exportBtn">Export HTML</button>
      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="syncNowBtn">Sync</button>
    </div>
    <div class="save-status" id="saveStatus"></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Filter pages…" autocomplete="off">
    </div>
    <p class="toc-label">Pages</p>
    <div class="tree" id="tree"></div>
    <p class="meta-note">Shared wiki — everyone who opens this page sees the same content. Edit mode: type into any page, × to delete, drag to reorder. Export downloads a standalone copy.</p>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add a new page</h3>
    <label>Page title</label>
    <input id="newPageTitle" placeholder="e.g. 14.3 API Testing">
    <label>Parent page</label>
    <select id="newPageParent"><option value="">— Top level (no parent) —</option></select>
    <div class="modal-actions">
      <button class="btn" id="cancelAddBtn">Cancel</button>
      <button class="btn primary" id="confirmAddBtn">Create page</button>
    </div>
  </div>
</div>

<script>
// ---------- DEFAULT CONTENT (seed) ----------
const DEFAULT_PAGES = [
{id:"1", parent:null, title:"1. Introduction to KaneAI", body:`<p>What KaneAI is, the problem it solves, and how it solves it. Open a sub-page below for detail.</p>`},
{id:"1.1", parent:"1", title:"1.1 What KaneAI Is", body:`<p>KaneAI is TestMu AI's (formerly LambdaTest's) GenAI-native test automation assistant. You describe what you want tested in plain natural language, and it turns that into an executable, maintainable automated test — for web, mobile, and API testing — without writing or maintaining code.</p>`},
{id:"1.2", parent:"1", title:"1.2 The Problem It Solves", body:`<ul>
<li><strong>Technical barrier</strong> — writing/maintaining scripts needs programming skill; only engineers can contribute to test creation.</li>
<li><strong>Framework complexity</strong> — juggling multiple frameworks/languages/integrations creates ongoing overhead.</li>
<li><strong>Scalability</strong> — as an app grows, test suites get harder to organize and keep passing.</li>
<li><strong>Security</strong> — safely handling credentials and sensitive test data across environments.</li>
<li><strong>CI/CD friction</strong> — wiring testing into pipelines usually needs heavy, ongoing configuration.</li>
</ul>`},
{id:"1.3", parent:"1", title:"1.3 How KaneAI Addresses It", body:`<ul>
<li><strong>Intelligent input processing</strong> — generates structured test cases from text, Jira tickets, PDFs, images, audio, video, or spreadsheets, or author conversationally.</li>
<li><strong>Unified test management</strong> — test cases, execution plans, and results all live in Test Manager.</li>
<li><strong>Multi-language/framework export</strong> — export real automation code (Selenium, Playwright, Appium, etc.).</li>
<li><strong>API testing built in</strong> — understands API contracts, generates meaningful assertions automatically.</li>
<li><strong>Auto-healing</strong> — adapts existing tests when the UI changes instead of letting them break.</li>
<li><strong>CI/CD-ready</strong> — plugs into existing pipelines with minimal config.</li>
</ul>`},
{id:"1.4", parent:"1", title:"1.4 One-Line Summary", body:`<p>KaneAI is where you describe a test in plain English; it becomes a structured, maintainable, exportable automated test — and from there it runs at scale on HyperExecute, TestMu AI's execution engine.</p>`},

{id:"2", parent:null, title:"2. The KaneAI Dashboard — Ways to Start", body:`<p>Four entry points into authoring — three direct authoring targets plus one objective-driven alternative. Open a sub-page for each.</p>`},
{id:"2.1", parent:"2", title:"2.1 Author Browser Test → Desktop", body:`<p>For testing a website/web app as it renders on a desktop browser (Chrome). Full flow detailed under Section 3.</p>`},
{id:"2.2", parent:"2", title:"2.2 Author Browser Test → Mobile Browser", body:`<p>For testing a website/web app as it renders inside a mobile browser (Chrome on Android, Safari on iOS) — same authoring shape as Desktop, different device target and Advanced Settings set. Full flow detailed under Section 5.</p>`},
{id:"2.3", parent:"2", title:"2.3 Create an App Test → Mobile App (Native)", body:`<p>For testing a native Android or iOS application (an uploaded APK/IPA), not a website. Full flow detailed under Section 4.</p>`},
{id:"2.4", parent:"2", title:"2.4 Intelligent Test Planner (alternate path)", body:`<p>Instead of stepping through instructions one at a time, give KaneAI a single high-level objective and it plans and generates the entire test flow in one pass. Full detail under Section 6.</p>`},

{id:"3", parent:null, title:"3. Authoring Flow: Desktop Browser Test", body:`<p><strong>Target: Desktop Web.</strong> The step-by-step flow, authoring-time options, and the full Advanced Settings table live in the sub-pages below.</p>`},
{id:"3.1", parent:"3", title:"3.1 Step-by-Step Flow", body:`<p><strong>Step 1 —</strong> From the KaneAI dashboard, click <strong>Author Browser Test</strong>.</p>
<p><strong>Step 2 —</strong> Select <strong>Desktop</strong> from the side panel.</p>
<p><strong>Step 3 —</strong> Optionally set advanced options before you begin (see 3.2), then click <strong>Author Test</strong>.</p>
<p><strong>Step 4 —</strong> Instruct KaneAI in natural language ("Click Login," "Type test@example.com in the email field," "Assert the dashboard heading is visible") — each instruction becomes an executable step in real time.</p>
<p><strong>Step 5 —</strong> Optionally use <strong>Manual Interaction Mode</strong> for steps easier to do than describe (see Section 7).</p>
<p><strong>Step 6 —</strong> Steps queue in real time as you add them. Click <strong>Finish Test</strong> once done.</p>
<p><strong>Step 7 —</strong> Save: choose Project + Folder; Name/Description auto-generate but are editable; set Type, Status, Tags. This is the moment the test case enters <strong>Test Manager</strong>.</p>
<p><strong>Step 8 —</strong> Click <strong>Execute Test Case</strong> to hand off to HyperExecute.</p>`},
{id:"3.2", parent:"3", title:"3.2 Advanced Options at Authoring Time", body:`<p><strong>Chrome Options</strong> — command-line switches that alter Chrome's default browser behavior for the session.</p>
<p><strong>Custom Headers</strong> — keep crucial information about the request/response (method, URL, body content) carried through the session.</p>`},
{id:"3.3", parent:"3", title:"3.3 Advanced Settings Table (Desktop Web)", body:`<p>These can also be revisited and changed after authoring from Test Summary → Edit Test Steps (see Section 8).</p>
<table>
<tr><th>Setting</th><th>Control Type</th><th>Description</th></tr>
<tr><td>Network Configuration</td><td>Dropdown (Tunnel / Inactive)</td><td>Select tunnel or proxy for accessing applications behind firewalls</td></tr>
<tr><td>Timezone</td><td>Dropdown</td><td>Set the timezone your tests will run in</td></tr>
<tr><td>Chrome Options</td><td>Toggle + multi-input</td><td>Add up to 10 Chrome browser command-line flags</td></tr>
<tr><td>Custom Headers</td><td>Toggle + multi-input</td><td>Add up to 10 custom HTTP headers to inject into your test case</td></tr>
</table>`},

{id:"4", parent:null, title:"4. Authoring Flow: Mobile App Test (Native)", body:`<p><strong>Target: Native Mobile App (Android/iOS).</strong> Flow, per-platform advanced settings, and app-specific capabilities live in the sub-pages below.</p>`},
{id:"4.1", parent:"4", title:"4.1 Step-by-Step Flow", body:`<p><strong>Step 1 —</strong> From the KaneAI homepage, click <strong>Create an App Test</strong>.</p>
<p><strong>Step 2 —</strong> Select the target OS (<strong>Android</strong> or <strong>iOS</strong>) and upload your application (APK for Android, IPA for iOS).</p>
<p><strong>Step 3 —</strong> Describe the desired outcomes in plain English (e.g. "Click on the hamburger menu button," "Write the test in the text field 'This is a sample app'," "Click on the '+' button"). Instructions queue automatically.</p>
<p><strong>Step 4 —</strong> Click <strong>Finish Test</strong> once the flow is complete.</p>
<p><strong>Step 5 —</strong> Save: select Project + Folder; Name/Description auto-generate but are editable; set Type, Status, Tags.</p>
<p><strong>Step 6 —</strong> Click the <strong>HyperExecute</strong> button to execute — redirects to the HyperExecute dashboard.</p>`},
{id:"4.2", parent:"4", title:"4.2 Advanced Settings — Android App", body:`<p><strong>Top-level settings:</strong></p>
<table>
<tr><th>Setting</th><th>Control Type</th><th>Description</th></tr>
<tr><td>Network Configuration</td><td>Dropdown (Tunnel / Inactive)</td><td>Tunnel or proxy for apps behind firewalls</td></tr>
<tr><td>Auto-login through Google</td><td>Toggle + credentials</td><td>Start session pre-authenticated with a Google account</td></tr>
<tr><td>GPS Location</td><td>Toggle + lat/long input</td><td>Mock GPS coordinates on the real device</td></tr>
</table>
<p><strong>Session settings:</strong></p>
<table>
<tr><th>Setting</th><th>Control Type</th><th>Description</th></tr>
<tr><td>Auto-Grant Permissions</td><td>Toggle</td><td>Auto-grant all Android Manifest permissions</td></tr>
<tr><td>Enable Keyboard</td><td>Toggle</td><td>Use a specialized Unicode-enabled keyboard</td></tr>
<tr><td>Ignore Unimportant Views</td><td>Toggle</td><td>Ignore views marked unimportant for accessibility</td></tr>
<tr><td>Disable UI Idle Wait</td><td>Toggle</td><td>Skip idle wait before commands — useful for Flutter, React Native apps</td></tr>
<tr><td>Enable Secure Screenshot Mocking</td><td>Toggle</td><td>Mock secure screenshots (e.g. Salesforce-style use cases)</td></tr>
<tr><td>Disable Screenshot Block</td><td>Toggle</td><td>Disable secure screenshot blocking so authoring isn't hindered</td></tr>
<tr><td>Biometric Authentication</td><td>Toggle</td><td>Enable Fingerprint / Touch ID workflows (Android 11+)</td></tr>
<tr><td>Image Injection</td><td>Toggle</td><td>Enable image capture, QR code, and barcode scanning in-session</td></tr>
<tr><td>Video Injection</td><td>Toggle</td><td>Inject a video feed for live-detection / face-recognition flows</td></tr>
<tr><td>Device Orientation</td><td>Dropdown (Auto default)</td><td>Set device orientation for the session</td></tr>
<tr><td>Capture Network Logs</td><td>Toggle</td><td>Capture network logs for use in network assertions</td></tr>
<tr><td>Network Throttling</td><td>Dropdown</td><td>Select a throttling profile (3G/4G/5G/offline/lossy)</td></tr>
<tr><td>Timezone</td><td>Dropdown</td><td>Set timezone for the test session</td></tr>
<tr><td>Language</td><td>Dropdown</td><td>Set language for the test session</td></tr>
</table>`},
{id:"4.3", parent:"4", title:"4.3 Advanced Settings — iOS App", body:`<p><strong>Top-level settings:</strong></p>
<table>
<tr><th>Setting</th><th>Control Type</th><th>Description</th></tr>
<tr><td>Network Configuration</td><td>Dropdown (Tunnel / Inactive)</td><td>Select tunnel or proxy</td></tr>
<tr><td>GPS Location</td><td>Toggle + lat/long input</td><td>Mock GPS coordinates on the real device</td></tr>
</table>
<p><strong>Session settings:</strong></p>
<table>
<tr><th>Setting</th><th>Control Type</th><th>Description</th></tr>
<tr><td>Upload File</td><td>Toggle</td><td>Enable file uploads to the application</td></tr>
<tr><td>Auto-Accept Alerts</td><td>Toggle</td><td>Auto-accept system/app-level alerts</td></tr>
<tr><td>Auto-Dismiss Alerts</td><td>Toggle</td><td>Auto-dismiss system/app-level alerts</td></tr>
<tr><td>Biometric Authentication</td><td>Toggle</td><td>Enable Fingerprint / Touch ID</td></tr>
<tr><td>Image Injection</td><td>Toggle</td><td>Image capture, QR code, barcode scanning</td></tr>
<tr><td>Video Injection</td><td>Toggle</td><td>Inject a recorded video feed</td></tr>
<tr><td>Device Orientation</td><td>Dropdown (Auto default)</td><td>Set orientation</td></tr>
<tr><td>Capture Network Logs</td><td>Toggle</td><td>Capture network logs</td></tr>
<tr><td>Network Throttling</td><td>Dropdown</td><td>Select throttling profile</td></tr>
<tr><td>Timezone</td><td>Dropdown</td><td>Set timezone</td></tr>
<tr><td>Language</td><td>Dropdown</td><td>Set language</td></tr>
</table>`},
{id:"4.4", parent:"4", title:"4.4 Advanced Mobile App Authoring Capabilities", body:`<p><strong>Disable Screenshot Block</strong> — if the app blocks screenshots by default, this disables that block so KaneAI can author against it without hindrance. Must be enabled from advanced settings <em>before</em> the authoring session starts.</p>
<p><strong>Biometric Authentication</strong> — lets you test biometric auth flows (fingerprint/Face ID) accurately across devices; without it the biometric prompt can't be automated through.</p>
<p><strong>Image Injection</strong> — enables authoring of image-capture, QR-code, and barcode-scanning flows on real devices. Once enabled, inject an image via a "/" slash command in-session, used right before triggering the app's camera API.</p>
<p><strong>Video Injection</strong> — enables testing of live-streaming, real-time video capture, and video-processing flows on real devices. Same slash-command mechanism as Image Injection, used before the camera API trigger.</p>`},
{id:"4.5", parent:"4", title:"4.5 Deeplinks", body:`<p><strong>What it is</strong> — a URL-based mechanism to jump directly to a specific screen/functionality in the app, bypassing standard navigation.</p>
<p><strong>How to add one</strong> — type <code>/</code> in the instruction input box, select <strong>Deeplink</strong> from the menu, then provide:</p>
<ul>
<li><strong>URL</strong> (required) — e.g. <code>kaneai://settings</code> or <code>myapp://product/123</code></li>
<li><strong>App package for target</strong> (required) — Android package name or iOS bundle ID; KaneAI auto-prefills this from the currently installed app</li>
</ul>
<p><strong>Best practices</strong> — verify the app actually has deeplink handling implemented; manually test the deeplink before automating it; add assertions after invoking it to confirm the right screen loaded; handle edge cases (not logged in, invalid params).</p>
<p><strong>Troubleshooting</strong> — "Deeplink not working" (check URL format, package/bundle ID match, app running); "Wrong screen opens" (check path/params, routing config, conflicting schemes); "App crashes on deeplink" (validate with dev team, check permissions/data, review app logs).</p>`},

{id:"5", parent:null, title:"5. Authoring Flow: Mobile Browser Test", body:`<p><strong>Target: Mobile Web.</strong> Same flow shape as Desktop, different Advanced Settings — see sub-pages.</p>`},
{id:"5.1", parent:"5", title:"5.1 Step-by-Step Flow", body:`<p>Same overall shape as Desktop Browser authoring (Section 3.1) — <strong>Author Browser Test → Mobile</strong> instead of Desktop, then the rest of the flow (natural-language instructions, Manual Interaction option, save to Test Manager, execute on HyperExecute) is identical in structure.</p>`},
{id:"5.2", parent:"5", title:"5.2 Advanced Settings — Android Web", body:`<p>Shares most settings with Android App (4.2), with these differences:</p>
<ul>
<li><strong>Custom Headers</strong> is available here (Toggle + multi-input, up to 10 custom HTTP headers) — not present on native App.</li>
<li><strong>Biometric Authentication, Image Injection, and Video Injection are NOT available</strong> on mobile web (native-app-only capabilities).</li>
</ul>`},
{id:"5.3", parent:"5", title:"5.3 Advanced Settings — iOS Web", body:`<p>Shares most settings with iOS App (4.3), same pattern of differences:</p>
<ul>
<li><strong>Custom Headers</strong> is available (Toggle + multi-input, up to 10 headers).</li>
<li><strong>Biometric Authentication, Image Injection, and Video Injection are NOT available.</strong></li>
</ul>`},

{id:"6", parent:null, title:"6. Alternative Path: Intelligent Test Planner", body:`<p>Objective-driven alternative to step-by-step authoring, usable for any target. See sub-pages for each stage.</p>`},
{id:"6.1", parent:"6", title:"6.1 Define the Objective", body:`<p>A single plain-language goal, e.g. <em>"Verify the add-to-cart functionality on www.example.com."</em> Pressing enter tells KaneAI to start analyzing the actions needed.</p>`},
{id:"6.2", parent:"6", title:"6.2 Define Supporting Detail", body:`<ul>
<li><strong>Outcomes</strong> — what should happen if the flow works.</li>
<li><strong>Error Messages</strong> — what should appear if something goes wrong.</li>
<li><strong>Constraints</strong> — browsers/devices/OS to restrict testing to.</li>
<li><strong>User Inputs</strong> — data needed during the test (e.g. username/password).</li>
</ul>`},
{id:"6.3", parent:"6", title:"6.3 Review and Schedule", body:`<p>Review the generated plan, pick Project/Folder/Type/Status/labels, click <strong>Schedule Test</strong>.</p>`},
{id:"6.4", parent:"6", title:"6.4 Check Execution", body:`<p>Click <strong>Live Preview</strong> to enter the Playground and watch the generated test run live, end to end. The result saves to Test Manager exactly like a manually authored test.</p>`},

{id:"7", parent:null, title:"7. Manual Interaction Mode", body:`<p>Common to both Desktop and Mobile authoring. See sub-pages for full detail.</p>`},
{id:"7.1", parent:"7", title:"7.1 Overview", body:`<p>Lets you take direct control of the app during authoring instead of relying only on natural-language instructions — you interact in real time and the agent records everything as structured test steps. Useful for reaching a very specific UI state, complex flows, or elements hard to describe in words.</p>`},
{id:"7.2", parent:"7", title:"7.2 Supported Platforms", body:`<ul>
<li>Web browser test authoring on desktop</li>
<li>Mobile app test authoring on Android</li>
<li>Mobile app test authoring on iOS</li>
</ul>`},
{id:"7.3", parent:"7", title:"7.3 How It Works", body:`<p>Click <strong>Manual Interaction</strong> to enable it. Every click, type, scroll, or navigation is captured automatically and converted into natural-language test steps — no need to describe them separately. Click <strong>Turn off Manual Interaction</strong> to go back to typed instructions.</p>`},
{id:"7.4", parent:"7", title:"7.4 Pause Recording", body:`<p>Temporarily pause capture (e.g. to log in, dismiss unrelated dialogs, or explore without cluttering the step list). The session enters a <strong>Draft</strong> state — fully interactable, but nothing is added to the step list — until you click <strong>Start recording</strong> again.</p>`},
{id:"7.5", parent:"7", title:"7.5 What It Cannot Record", body:`<p>Must be added via natural language afterward:</p>
<ul>
<li>Assertions — no "verify/confirm/assert" capture</li>
<li>If–else logic / conditional branching</li>
<li>Modules and reusable blocks</li>
<li>Variables, Parameters, and Secrets</li>
<li>Datasets or dynamic data</li>
</ul>`},
{id:"7.6", parent:"7", title:"7.6 Platform-Specific Limitations", body:`<p><strong>Web Browser on Desktop:</strong> drag-and-drop on canvas-based elements is unreliable to record; hover-triggered tooltips/menus can't be recorded. (Double click, right click, and press-and-hold ARE supported.)</p>
<p><strong>Mobile Apps:</strong> two-finger scroll/multi-touch gestures aren't captured; copy-paste isn't captured; recent-apps navigation isn't supported; special keyboard keys (e.g. backspace) aren't recorded accurately; OS-level system popups (permission dialogs) can't be captured. Note: manual typing records every character attempted, even ones a restricted input field rejects.</p>`},
{id:"7.7", parent:"7", title:"7.7 Editing Recorded Steps", body:`<p>Once recorded, only the <strong>locator name</strong> can be edited on a Manual Interaction step — action type, element behavior, and interaction flow can't be changed after the fact. If a step doesn't match intent, delete and re-record it, or recreate via natural language.</p>`},

{id:"8", parent:null, title:"8. Editing Advanced Settings After Authoring", body:`<p>How to change an existing test case's settings without recreating it. See sub-pages.</p>`},
{id:"8.1", parent:"8", title:"8.1 The Two Save Options", body:`<ul>
<li><strong>Apply Settings</strong> — saves the update and generates a new version with regenerated code. Use when the setting change doesn't affect the test steps themselves.</li>
<li><strong>Edit Test Steps</strong> — saves the update and opens the Playground so you can adjust steps to match. Use when the setting change may require flow changes.</li>
</ul>`},
{id:"8.2", parent:"8", title:"8.2 Step-by-Step", body:`<p><strong>Step 1 —</strong> Open the test case's <strong>Test Summary</strong> tab.</p>
<p><strong>Step 2 —</strong> Click <strong>Edit Test Steps</strong> to open the Advanced Settings panel — shows current config.</p>
<p><strong>Step 3 —</strong> Modify settings (e.g. Network Configuration, Timezone, Chrome Options, Custom Headers). Anything changed shows an <strong>Edited</strong> badge.</p>
<p><strong>Step 4 —</strong> Choose <strong>Apply Settings</strong> or <strong>Edit Test Steps</strong> to save.</p>`},
{id:"8.3", parent:"8", title:"8.3 Version History", body:`<p>Every applied settings change creates a new version. The <strong>Version History</strong> tab shows a diff of exactly what changed between versions (e.g. updated network config or timezone).</p>`},
{id:"8.4", parent:"8", title:"8.4 Limitations", body:`<ul>
<li>Only advanced settings are editable here — changing test steps, OS, browser, or device configuration requires the Playground.</li>
<li>A new version is always generated on Apply — no in-place update.</li>
<li>Version diffs only work for versions created after this feature rolled out — older versions show no advanced-settings history.</li>
</ul>`},

{id:"9", parent:null, title:"9. Test Manager", body:`<p>Where test cases live between authoring and execution. See sub-pages.</p>`},
{id:"9.1", parent:"9", title:"9.1 What It Is", body:`<p>The hub between "a test case exists" and "a test case is running." Every authored test case (any path) lands here, organized by <strong>Project → Folder</strong>. This is also where <strong>Test Runs</strong> are created.</p>`},
{id:"9.2", parent:"9", title:"9.2 Key Things to Know", body:`<ul>
<li>A test case carries a label showing how it was authored: <strong>New Experience</strong> or <strong>Classic</strong> — matters later for Evidence Reporting eligibility (10.3).</li>
<li>A test case only becomes selectable for a Test Run once its <strong>code generation has completed</strong>.</li>
</ul>`},

{id:"10", parent:null, title:"10. Creating and Configuring a Test Run", body:`<p>The bridge from Test Manager to HyperExecute. See sub-pages.</p>`},
{id:"10.1", parent:"10", title:"10.1 Step-by-Step", body:`<p><strong>Step 1 —</strong> In Test Manager, open the relevant Project → Test Cases section.</p>
<p><strong>Step 2 —</strong> Test Run section → <strong>Create Test Run</strong>. Provide Name, Description, Tags, Type → <strong>KaneAI Generated Test Cases</strong>.</p>
<p><strong>Step 3 —</strong> Select test cases → <strong>Add Test Case</strong>.</p>
<p><strong>Step 4 —</strong> Assign a team member per test case (bulk supported); attach at least one Configuration (Desktop config needs OS, OS Version, Browser, Browser Version, Resolution; Real Device config needs OS, Manufacturer, Device, OS Version, App).</p>
<p><strong>Step 5 —</strong> Click <strong>Show execution preview</strong>, then <strong>Save test run</strong>.</p>
<p><strong>Step 6 —</strong> Click <strong>Run on HyperExecute</strong> → <strong>Run Instances Now</strong> or <strong>Schedule Test Run</strong>. Set concurrency, start.</p>`},
{id:"10.2", parent:"10", title:"10.2 Advanced Configurations at Run Time", body:`<table>
<tr><th>Category</th><th>Notable settings</th></tr>
<tr><td>Test Configuration</td><td>Console Log level, Network Logs, Network Full HAR, Timezone, Retry on Failure (default on), Max Retries (max 5, default 1)</td></tr>
<tr><td>Region</td><td>Where web VMs or mobile devices are allocated from</td></tr>
<tr><td>Network</td><td>Tunnel, Dedicated Proxy, or Geolocation — only one of these three per execution</td></tr>
<tr><td>Replace URL</td><td>Swap a URL pattern across the whole run without editing each test case</td></tr>
<tr><td>Performance</td><td>Lighthouse reports (web); App Profiling (native mobile)</td></tr>
<tr><td>Visual Regression</td><td>SmartUI config: browsers, viewports, devices, orientation</td></tr>
<tr><td>Accessibility</td><td>WCAG 2.1 AA checks — web only, Chrome/Edge only, can slow execution</td></tr>
<tr><td>Reports</td><td>HTML or Extent report (one active at a time); optional email to up to 10 recipients</td></tr>
</table>`},
{id:"10.3", parent:"10", title:"10.3 Evidence Reporting", body:`<p>A richer report (includes coverage detail + business use cases) is available only if <strong>both</strong> are true:</p>
<ol><li>Every test case in the run is <strong>New Experience</strong> (not Classic).</li><li>The run executes on <strong>Chrome</strong>.</li></ol>
<p>If either fails, the run silently falls back to the Classic report — flag this proactively to customers.</p>`},

{id:"11", parent:null, title:"11. What Is HyperExecute?", body:`<p>The orchestration engine behind execution. See sub-pages.</p>`},
{id:"11.1", parent:"11", title:"11.1 Concept", body:`<p>TestMu AI's AI-native test orchestration cloud — the engine that runs the test at scale. It <strong>replaces the traditional "hub-and-node" test grid model</strong>, provisioning execution environments <strong>just-in-time (JIT)</strong> instead of routing everything through a central hub.</p>`},
{id:"11.2", parent:"11", title:"11.2 What That Buys You", body:`<ul>
<li>Faster time-to-market — parallel execution across available resources</li>
<li>Elastic scale — 10 tests or 10,000, same platform</li>
<li>Framework-agnostic — Selenium, Playwright, Puppeteer, Cypress, Appium, Espresso, Maestro, XCUI, performance, API</li>
<li>Multi-team, multi-framework on the same license simultaneously</li>
</ul>
<p>For a KaneAI-generated test, you never touch HyperExecute's YAML/CLI directly — Test Manager builds and triggers the job automatically.</p>`},

{id:"12", parent:null, title:"12. The HyperExecute Execution Lifecycle", body:`<p>Four nested levels: Job → Task → Stage → Test. See each sub-page.</p>
<pre>JOB  (the whole Test Run trigger)
 └── TASK  (one browser/OS or device/app combination)
      └── STAGE  (Pre Steps → Scenarios → Post Steps)
           └── TEST  (an individual assertion-bearing check)</pre>`},
{id:"12.1", parent:"12", title:"12.1 Job Level", body:`<table>
<tr><th>Status</th><th>Meaning</th></tr>
<tr><td>Initiated</td><td>Payload uploading, waiting for a matching VM</td></tr>
<tr><td>Running</td><td>Actively executing across configured combinations</td></tr>
<tr><td>Completed</td><td>All tests finished — pass or fail</td></tr>
<tr><td>Partially Completed</td><td>Runner steps finished but no test session created (API/Desktop or local web execution)</td></tr>
<tr><td>Failed</td><td>One or more test cases hit errors or failed assertions</td></tr>
<tr><td>Aborted</td><td>Unexpected error terminated the job early</td></tr>
<tr><td>Lambda Error</td><td>Platform-side error</td></tr>
<tr><td>Time Out</td><td>Exceeded max execution time (150-min global ceiling)</td></tr>
<tr><td>Ignored</td><td>User-defined — intentionally not executed</td></tr>
<tr><td>Blocked</td><td>Stuck on external dependency/resource constraint</td></tr>
</table>
<p><strong>Abort options:</strong> Abort Current Job / Abort All Jobs / Abort Selected Jobs. Unexecuted tests get marked <strong>Cancelled</strong>.</p>`},
{id:"12.2", parent:"12", title:"12.2 Task Level", body:`<table>
<tr><th>Status</th><th>Meaning</th></tr>
<tr><td>Initiated</td><td>Payload uploaded, waiting for VM assignment</td></tr>
<tr><td>Running</td><td>Executing per config</td></tr>
<tr><td>Completed</td><td>All assigned steps finished, every test passed</td></tr>
<tr><td>Skipped</td><td>User-defined, intentionally bypassed</td></tr>
<tr><td>Failed</td><td>One or more assertions failed</td></tr>
<tr><td>Ignored</td><td>Disregarded per config/condition</td></tr>
<tr><td>Aborted</td><td>Terminated early</td></tr>
<tr><td>Time Out</td><td>Exceeded own time limit</td></tr>
<tr><td>Lambda Error</td><td>Platform-side error</td></tr>
<tr><td>Blocked</td><td>Stuck on dependency/resource limits</td></tr>
</table>`},
{id:"12.3", parent:"12", title:"12.3 Stage Level", body:`<p>Every Task runs through up to three categories: <strong>Pre Steps</strong> (setup, e.g. dependency install), <strong>Scenarios</strong> (actual test execution), <strong>Post Steps</strong> (cleanup/reporting).</p>
<table>
<tr><th>Status</th><th>Meaning</th></tr>
<tr><td>Running</td><td>Currently executing this stage</td></tr>
<tr><td>Completed</td><td>All steps finished successfully</td></tr>
<tr><td>Ignored</td><td>Bypassed per config/condition</td></tr>
<tr><td>Skipped</td><td>Intentionally bypassed</td></tr>
<tr><td>Failed</td><td>An assertion inside the stage failed</td></tr>
<tr><td>Muted</td><td>Suppressed by test-muting</td></tr>
<tr><td>Aborted</td><td>Terminated prematurely</td></tr>
<tr><td>Cancelled</td><td>Job aborted mid-run</td></tr>
<tr><td>Lambda Error</td><td>Platform-side error</td></tr>
</table>`},
{id:"12.4", parent:"12", title:"12.4 Test Level", body:`<p>The most granular unit.</p>
<table>
<tr><th>Status</th><th>Meaning</th></tr>
<tr><td>Created</td><td>Defined, not yet started</td></tr>
<tr><td>Running</td><td>Actively executing</td></tr>
<tr><td>Completed</td><td>Finished and passed</td></tr>
<tr><td>Queue</td><td>Waiting for VM allocation</td></tr>
<tr><td>Queue Timeout</td><td>Waited too long for VM allocation</td></tr>
<tr><td>Stopped</td><td>Containing stage was aborted</td></tr>
<tr><td>Idle Timeout</td><td>Session inactive past threshold</td></tr>
<tr><td>Lambda Error</td><td>Platform-side error</td></tr>
</table>`},
{id:"12.5", parent:"12", title:"12.5 User-Defined Status via Lambda Hooks", body:`<pre>driver.executeScript("lambda-status=passed");
driver.executeScript("lambda-status=failed");
driver.executeScript("lambda-status=skipped");
driver.executeScript("lambda-status=ignored");
driver.executeScript("lambda-status=unknown");
driver.executeScript("lambda-status=error");</pre>
<p><strong>Why it matters:</strong> if a script marks "passed" inside a try/catch before a real failure surfaces, HyperExecute faithfully reports "Passed" — the root cause behind a common ticket pattern.</p>`},
{id:"12.6", parent:"12", title:"12.6 Scenario Priority Mapping", body:`<table>
<tr><th>Priority</th><th>User-Marked Test Status</th><th>Resulting Scenario Status</th></tr>
<tr><td>P0 (highest)</td><td>Failed</td><td>Failed</td></tr>
<tr><td>P1</td><td>Error</td><td>Failed</td></tr>
<tr><td>P2</td><td>Passed</td><td>Completed</td></tr>
<tr><td>P3</td><td>Ignored</td><td>Completed</td></tr>
<tr><td>P4</td><td>Skipped</td><td>Completed</td></tr>
<tr><td>P5 (lowest)</td><td>Unknown</td><td>Completed</td></tr>
</table>
<p>If even one test inside a scenario reports Failed or Error, the whole scenario is Failed — Failed always wins.</p>`},

{id:"13", parent:null, title:"13. Reports: Where Results Land", body:`<p>See sub-pages for each report type.</p>`},
{id:"13.1", parent:"13", title:"13.1 HTML Report", body:`<p>Job metadata, pass/fail summary with donut charts, scenario summary, task analytics, browser-level breakdown, per-test links to video recordings.</p>`},
{id:"13.2", parent:"13", title:"13.2 Extent Report", body:`<p>Richer interactive dashboard: visual pass/fail summary, trend data, step-by-step breakdown per test case with screenshots.</p>`},
{id:"13.3", parent:"13", title:"13.3 Email Delivery", body:`<p>If configured, recipients get an email summary with the HTML report attached.</p>`},

{id:"14", parent:null, title:"14. Catalog of Common Authoring Features", body:`<p>These live under KaneAI's "Common" Features section and apply across Desktop/Mobile authoring. Not all are deep-dived yet — this page is a checklist. Use <strong>+ Add page</strong> to promote any of these into a full sub-page as you learn it (parent this page).</p>
<ul>
<li><strong>Manual Interaction</strong> — see Section 7.</li>
<li><strong>JavaScript Execution</strong> — run custom JS snippets mid-test.</li>
<li><strong>Geolocation, Tunnel, and Proxy</strong> — network access options, also surfaced at Test Run level (10.2).</li>
<li><strong>Auto-Heal</strong> — automatically adapts a test when the underlying UI/selectors change.</li>
<li><strong>Scroll in Element</strong> — scroll within a specific scrollable container rather than the whole page.</li>
<li><strong>Drag and Drop</strong> — native drag-and-drop instruction support.</li>
<li><strong>Click Interactions</strong> — double click, right click, press-and-hold, and related gesture support.</li>
<li><strong>Jira Integration</strong> — link test cases/results back to Jira tickets.</li>
<li><strong>API Testing</strong> — author and assert API calls within a KaneAI flow.</li>
<li><strong>Modules</strong> — reusable step groups shared across test cases.</li>
<li><strong>Upload and Download Files</strong> — file upload/download handling during a session.</li>
<li><strong>TOTP Authentication</strong> — handle time-based one-time-password login flows.</li>
<li><strong>Database</strong> — connect to and query a database as part of a test.</li>
<li><strong>Rename Steps</strong> — rename authored steps for clarity/searchability.</li>
<li><strong>Conditional Logic</strong> — if/else branching within a test flow.</li>
<li><strong>While Loops</strong> — loop a set of steps while a condition holds.</li>
<li><strong>Network Logs Assertions</strong> — assert against captured network call data.</li>
<li><strong>Custom Headers</strong> — inject custom HTTP headers (also an Advanced Setting — 3.3 / 5.2 / 5.3).</li>
</ul>`},

{id:"15", parent:null, title:"15. Platform-Level HyperExecute Features", body:`<ul>
<li><strong>Test Splitting & Multiplexing</strong> — Smart Auto-Split, Matrix, or Hybrid strategies to divide execution across resources.</li>
<li><strong>FailFast</strong> — deliberately fail a job quickly once a failure threshold is hit, saving time/cost.</li>
<li><strong>Jobs Prioritization</strong> — label certain jobs to run ahead of others in the queue.</li>
<li><strong>AI-Native Root Cause Analysis</strong> — classifies failure types, points toward likely fixes.</li>
<li><strong>Auto Healing</strong> — automatic recovery from certain failure classes mid-execution.</li>
<li><strong>Background Services</strong> — long-running dependencies (app servers, databases) with their own dashboard logs.</li>
<li><strong>Test Muting</strong> — mute scenarios that fail repeatedly and predictably.</li>
<li><strong>Jobs Archiving</strong> — archive low-value jobs so dashboards stay focused.</li>
<li><strong>Task Metrics</strong> — CPU/memory utilization tracking per virtual machine.</li>
</ul>`},

{id:"16", parent:null, title:"16. Quick Glossary", body:`<table>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td>KaneAI</td><td>The natural-language test authoring product</td></tr>
<tr><td>Test Manager</td><td>Where authored test cases and Test Runs are organized (Project → Folder → Test Case)</td></tr>
<tr><td>Test Run</td><td>A named execution instruction wrapping one or more test cases + configurations</td></tr>
<tr><td>HyperExecute</td><td>The orchestration/execution engine that runs tests at scale</td></tr>
<tr><td>Job</td><td>One triggered execution of a Test Run on HyperExecute</td></tr>
<tr><td>Task</td><td>One browser/OS or device/app slice within a Job</td></tr>
<tr><td>Stage</td><td>Pre Steps / Scenarios / Post Steps within a Task</td></tr>
<tr><td>Test</td><td>The most granular pass/fail unit</td></tr>
<tr><td>New Experience vs. Classic</td><td>Two authoring modes; New Experience required for Evidence Reporting</td></tr>
<tr><td>Evidence Report</td><td>Richer report type; requires New Experience + Chrome-only execution</td></tr>
<tr><td>Concurrency</td><td>How many test instances run in parallel within a Test Run</td></tr>
<tr><td>Manual Interaction Mode</td><td>Recording live actions instead of typing instructions</td></tr>
<tr><td>Deeplink</td><td>URL-based direct navigation to a specific in-app screen (mobile app only)</td></tr>
</table>`},

{id:"17", parent:null, title:"17. Suggested First-Week Path", body:`<ol>
<li><strong>Day 1–2:</strong> Read this wiki fully. Author one Desktop Browser test end-to-end (Section 3), through to execution on HyperExecute.</li>
<li><strong>Day 2:</strong> Author a Mobile App test (Section 4) — try enabling Image Injection or Biometric Authentication once, just to see the toggle in context.</li>
<li><strong>Day 3:</strong> Try the Intelligent Test Planner (Section 6) on the same target — compare the generated flow to what you authored manually.</li>
<li><strong>Day 3:</strong> Create a Test Run from an existing test case (Section 10) — pay close attention to configuration; most early tickets trace back to a missing/wrong configuration here.</li>
<li><strong>Day 4:</strong> Open a completed Job and manually trace it: Job → Task → Stage → Test. Find one Passed and one Failed example and understand why, using Section 12's tables.</li>
<li><strong>Day 5:</strong> Read a real HTML and Extent report side by side (Section 13).</li>
<li><strong>Ongoing:</strong> Keep Section 12 (status tables), Section 4/5 (advanced settings tables), and Section 16 (glossary) bookmarked.</li>
</ol>`}
];

// Project Settings → API in your Supabase dashboard.
const SUPABASE_URL = "https://qlnmrfzdxwqaqudckkqp.supabase.co";        // e.g. "https://xxxxx.supabase.co"
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsbm1yZnpkeHdxYXF1ZGNra3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Nzg0NTIsImV4cCI6MjEwNDM1NDQ1Mn0.vw45I388YPChRtNfV6PBBXvhUYSgdL-8oYMQc0Ms91M";        // the "anon public" key
const WIKI_ROW_ID = "kaneai-wiki";
const SUPABASE_CONFIGURED = !SUPABASE_URL.includes("YOUR_SUPABASE_URL") && !SUPABASE_ANON_KEY.includes("YOUR_ANON_KEY");
const LOCAL_FALLBACK_KEY = "kaneai_wiki_pages_v1_fallback";

// ---------- STATE ----------
let PAGES = [];
let currentId = null;
let editMode = false;
let lastSyncedJson = "";

function supaHeaders(extra){
  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}

async function loadPages(){
  if(!SUPABASE_CONFIGURED){
    setSyncStatus("Local only — Supabase not configured");
    try{
      const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
      return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_PAGES));
    }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_PAGES)); }
  }
  try{
    setSyncStatus("Loading from shared wiki…");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/wiki_store?id=eq.${WIKI_ROW_ID}&select=pages`, {
      headers: supaHeaders()
    });
    if(!res.ok) throw new Error("fetch failed: " + res.status);
    const rows = await res.json();
    if(rows.length && rows[0].pages && rows[0].pages.length){
      setSyncStatus("Synced " + new Date().toLocaleTimeString());
      return rows[0].pages;
    }
    // Row exists but empty (fresh setup) — seed it with the defaults
    const seeded = JSON.parse(JSON.stringify(DEFAULT_PAGES));
    await fetch(`${SUPABASE_URL}/rest/v1/wiki_store?id=eq.${WIKI_ROW_ID}`, {
      method: "PATCH", headers: supaHeaders({"Prefer":"return=minimal"}),
      body: JSON.stringify({ pages: seeded })
    });
    setSyncStatus("Seeded shared wiki " + new Date().toLocaleTimeString());
    return seeded;
  }catch(err){
    console.error(err);
    setSyncStatus("⚠ Offline — showing local copy");
    try{
      const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
      return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_PAGES));
    }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_PAGES)); }
  }
}

async function savePages(silent){
  localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(PAGES));
  if(!SUPABASE_CONFIGURED){
    if(!silent){ document.getElementById('saveStatus').textContent = "Saved locally (Supabase not set up)"; showToast("Saved to this browser only — set up Supabase for shared saving"); }
    return;
  }
  try{
    setSyncStatus("Saving…");
    const res = await fetch(`${SUPABASE_URL}/rest/v1/wiki_store?id=eq.${WIKI_ROW_ID}`, {
      method: "PATCH", headers: supaHeaders({"Prefer":"return=minimal"}),
      body: JSON.stringify({ pages: PAGES, updated_at: new Date().toISOString() })
    });
    if(!res.ok) throw new Error("save failed: " + res.status);
    lastSyncedJson = JSON.stringify(PAGES);
    setSyncStatus("Saved " + new Date().toLocaleTimeString());
    if(!silent) showToast("Saved — visible to everyone with this page");
  }catch(err){
    console.error(err);
    setSyncStatus("⚠ Save failed — check connection");
    if(!silent) showToast("Couldn't reach the shared wiki — saved locally only");
  }
}

function setSyncStatus(msg){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = msg;
}

// Pull in anyone else's changes periodically without wiping current view unnecessarily
async function pollForRemoteChanges(){
  if(!SUPABASE_CONFIGURED) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/wiki_store?id=eq.${WIKI_ROW_ID}&select=pages`, { headers: supaHeaders() });
    if(!res.ok) return;
    const rows = await res.json();
    if(!rows.length) return;
    const remoteJson = JSON.stringify(rows[0].pages);
    if(remoteJson !== lastSyncedJson && remoteJson !== JSON.stringify(PAGES)){
      PAGES = rows[0].pages;
      lastSyncedJson = remoteJson;
      localStorage.setItem(LOCAL_FALLBACK_KEY, remoteJson);
      renderTree(document.getElementById('searchInput').value);
      if(currentId && !editMode) renderPage(currentId);
      setSyncStatus("Updated by someone else — refreshed " + new Date().toLocaleTimeString());
    }
  }catch(e){ /* silent — next poll will retry */ }
}

function getPage(id){ return PAGES.find(p => p.id === id); }
function getChildren(id){ return PAGES.filter(p => p.parent === id); }
function getTopLevel(){ return PAGES.filter(p => p.parent === null); }

// ---------- AUTO-NUMBERING ----------
function stripNumberPrefix(title){
  return title.replace(/^\d+(\.\d+)?\.?\s*/, '').trim();
}
function renumberAll(){
  getTopLevel().forEach((top, i)=>{
    const num = i + 1;
    top.title = `${num}. ${stripNumberPrefix(top.title)}`;
    getChildren(top.id).forEach((kid, j)=>{
      kid.title = `${num}.${j+1} ${stripNumberPrefix(kid.title)}`;
    });
  });
}

// ---------- REORDER (DRAG & DROP) ----------
let draggingId = null;
function movePage(draggedId, targetId, insertAfter){
  const dragged = getPage(draggedId);
  const target = getPage(targetId);
  if(!dragged || !target || dragged.id === target.id) return;
  if(dragged.parent !== target.parent){
    showToast("You can only reorder pages within the same level");
    return;
  }
  const draggedIdx = PAGES.findIndex(p => p.id === draggedId);
  PAGES.splice(draggedIdx, 1);
  const targetIdx = PAGES.findIndex(p => p.id === targetId);
  const insertPos = insertAfter ? targetIdx + 1 : targetIdx;
  PAGES.splice(insertPos, 0, dragged);
  renumberAll();
  savePages(true);
  renderTree(document.getElementById('searchInput').value);
  if(currentId) renderPage(currentId);
  showToast("Reordered");
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- RENDER TREE ----------
function renderTree(filter){
  const treeEl = document.getElementById('tree');
  const q = (filter||"").toLowerCase().trim();
  let html = "";
  getTopLevel().forEach(top=>{
    const kids = getChildren(top.id);
    const topMatch = !q || top.title.toLowerCase().includes(q);
    const kidMatches = kids.filter(k => !q || k.title.toLowerCase().includes(q));
    if(q && !topMatch && kidMatches.length === 0) return;
    html += `<div class="tree-item ${top.id===currentId?'active':''}" draggable="true" data-id="${top.id}" data-parent="">
      <a href="#" data-nav="${top.id}">${escapeHtml(top.title)}</a>
      <button class="del-btn" data-del="${top.id}" title="Delete page">×</button>
    </div>`;
    (q ? kidMatches : kids).forEach(k=>{
      html += `<div class="tree-item child ${k.id===currentId?'active':''}" draggable="true" data-id="${k.id}" data-parent="${top.id}">
        <a href="#" data-nav="${k.id}">${escapeHtml(k.title)}</a>
        <button class="del-btn" data-del="${k.id}" title="Delete page">×</button>
      </div>`;
    });
  });
  treeEl.innerHTML = html || `<p class="empty-state">No pages match.</p>`;
  treeEl.querySelectorAll('[data-nav]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); navigateTo(a.getAttribute('data-nav')); });
  });
  treeEl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); deletePage(btn.getAttribute('data-del')); });
  });

  // Drag and drop reordering (same-level only, i.e. same parent)
  const items = treeEl.querySelectorAll('.tree-item');
  items.forEach(item=>{
    item.addEventListener('dragstart', (e)=>{
      draggingId = item.getAttribute('data-id');
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      items.forEach(i=> i.classList.remove('drop-before','drop-after'));
    });
    item.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!draggingId || draggingId === item.getAttribute('data-id')) return;
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      items.forEach(i=> i.classList.remove('drop-before','drop-after'));
      item.classList.add(before ? 'drop-before' : 'drop-after');
    });
    item.addEventListener('drop', (e)=>{
      e.preventDefault();
      const targetId = item.getAttribute('data-id');
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      if(draggingId) movePage(draggingId, targetId, !before);
      draggingId = null;
    });
  });

  const activeItem = treeEl.querySelector('.tree-item.active');
  if(activeItem){ activeItem.scrollIntoView({block:'nearest'}); }
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---------- RENDER MAIN PAGE ----------
function renderPage(id){
  const page = getPage(id);
  const main = document.getElementById('main');
  if(!page){ main.innerHTML = `<p class="empty-state">Page not found.</p>`; return; }

  const parentPage = page.parent ? getPage(page.parent) : null;
  const breadcrumb = parentPage
    ? `<a href="#" data-nav="${parentPage.id}">${escapeHtml(parentPage.title)}</a> / ${escapeHtml(page.title)}`
    : `Top level`;

  const kids = getChildren(page.id);
  let childrenHtml = "";
  if(kids.length > 0 || editMode){
    childrenHtml = `<div class="children-section">
      <p class="children-label"><span>Sub-pages</span></p>
      <div class="children-grid">
        ${kids.map(k=>`<a class="child-card" href="#" data-nav="${k.id}"><span class="ct">${escapeHtml(k.title)}</span><button class="del-child" data-del="${k.id}">×</button></a>`).join("")}
        ${kids.length===0 ? '<p class="empty-state">No sub-pages yet.</p>' : ''}
      </div>
    </div>`;
  }

  main.innerHTML = `
    <div class="breadcrumb">${breadcrumb}</div>
    <h1 class="page-title" contenteditable="${editMode}" data-field="title">${escapeHtml(page.title)}</h1>
    <div class="edit-toolbar ${editMode ? 'show' : ''}">
      <button class="toolbar-btn" id="attachFileBtn" type="button">📎 Attach file</button>
      <button class="toolbar-btn" id="addLinkBtn" type="button">🔗 Add link</button>
      <input type="file" id="attachFileInput" accept=".jpg,.jpeg,.png,.pdf" style="display:none;">
    </div>
    <div class="content" contenteditable="${editMode}" data-field="body">${page.body}</div>
    ${childrenHtml}
  `;

  main.querySelectorAll('[data-nav]').forEach(a=>{
    a.addEventListener('click', (e)=>{ e.preventDefault(); navigateTo(a.getAttribute('data-nav')); });
  });
  main.querySelectorAll('.del-child').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); deletePage(btn.getAttribute('data-del')); });
  });

  const titleEl = main.querySelector('[data-field="title"]');
  const bodyEl = main.querySelector('[data-field="body"]');
  let autosaveTimer = null;
  function onEdit(){
    page.title = titleEl.textContent.trim() || page.title;
    page.body = bodyEl.innerHTML;
    clearTimeout(autosaveTimer);
    document.getElementById('saveStatus').textContent = "Editing…";
    autosaveTimer = setTimeout(()=>{ savePages(true); document.getElementById('saveStatus').textContent = "Auto-saved " + new Date().toLocaleTimeString(); renderTree(document.getElementById('searchInput').value); }, 900);
  }

  // ---- Track cursor position inside the content editor so toolbar inserts land in the right spot ----
  let savedRange = null;
  function captureSelection(){
    const sel = window.getSelection();
    if(sel.rangeCount > 0){
      const range = sel.getRangeAt(0);
      if(bodyEl.contains(range.commonAncestorContainer)) savedRange = range.cloneRange();
    }
  }
  bodyEl.addEventListener('mouseup', captureSelection);
  bodyEl.addEventListener('keyup', captureSelection);
  function insertAtCursor(html){
    bodyEl.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    if(savedRange){
      sel.addRange(savedRange);
    } else {
      const range = document.createRange();
      range.selectNodeAfter ? null : null;
      range.selectNode(bodyEl);
      range.collapse(false);
      sel.addRange(range);
    }
    document.execCommand('insertHTML', false, html);
    captureSelection();
    onEdit();
  }

  // ---- Attach file (image or PDF) via Supabase Storage ----
  const attachBtn = main.querySelector('#attachFileBtn');
  const fileInput = main.querySelector('#attachFileInput');
  if(attachBtn){
    attachBtn.addEventListener('click', ()=>{ captureSelection(); fileInput.click(); });
    fileInput.addEventListener('change', async ()=>{
      const file = fileInput.files[0];
      fileInput.value = "";
      if(!file) return;
      if(!SUPABASE_CONFIGURED){
        showToast("Set up Supabase Storage first — see the setup steps");
        return;
      }
      if(file.size > 10 * 1024 * 1024){
        showToast("File too large — 10MB limit for now");
        return;
      }
      attachBtn.disabled = true;
      attachBtn.textContent = "Uploading…";
      try{
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `${Date.now()}_${safeName}`;
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/wiki-attachments/${path}`, {
          method: "POST",
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": file.type || "application/octet-stream" },
          body: file
        });
        if(!res.ok) throw new Error("upload failed: " + res.status);
        const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/wiki-attachments/${path}`;
        const isImage = /^image\//.test(file.type) || /\.(jpe?g|png)$/i.test(file.name);
        const html = isImage
          ? `<img src="${publicUrl}" alt="${escapeHtml(file.name)}">`
          : `<a class="file-attachment" href="${publicUrl}" target="_blank" rel="noopener">📄 ${escapeHtml(file.name)}</a>`;
        insertAtCursor(html + "<p></p>");
        showToast("File attached");
      }catch(err){
        console.error(err);
        showToast("Upload failed — check the storage bucket setup");
      }finally{
        attachBtn.disabled = false;
        attachBtn.textContent = "📎 Attach file";
      }
    });
  }

  // ---- Add link ----
  const linkBtn = main.querySelector('#addLinkBtn');
  if(linkBtn){
    linkBtn.addEventListener('click', ()=>{
      captureSelection();
      const selectedText = savedRange ? savedRange.toString() : "";
      const url = prompt("Link URL (include https://):", "https://");
      if(!url) return;
      const text = prompt("Link text to display:", selectedText || url) || url;
      const html = `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`;
      insertAtCursor(html);
    });
  }

  titleEl.addEventListener('input', onEdit);
  bodyEl.addEventListener('input', onEdit);
}

function navigateTo(id){
  currentId = id;
  renderPage(id);
  renderTree(document.getElementById('searchInput').value);
}

// ---------- DELETE PAGE ----------
function deletePage(id){
  const page = getPage(id);
  if(!page) return;
  const kids = getChildren(id);
  const msg = kids.length > 0
    ? `Delete "${page.title}" and its ${kids.length} sub-page(s)? This can't be undone.`
    : `Delete "${page.title}"? This can't be undone.`;
  if(!confirm(msg)) return;
  const idsToRemove = new Set([id, ...kids.map(k=>k.id)]);
  PAGES = PAGES.filter(p => !idsToRemove.has(p.id));
  renumberAll();
  savePages(true);
  showToast("Page deleted");
  if(idsToRemove.has(currentId)){
    const fallback = getTopLevel()[0];
    currentId = fallback ? fallback.id : null;
  }
  renderTree(document.getElementById('searchInput').value);
  if(currentId) renderPage(currentId); else document.getElementById('main').innerHTML = `<p class="empty-state">No pages left. Add one to get started.</p>`;
}

// ---------- ADD PAGE ----------
const addModal = document.getElementById('addModal');
const newPageTitle = document.getElementById('newPageTitle');
const newPageParent = document.getElementById('newPageParent');

function openAddModal(){
  newPageTitle.value = "";
  newPageParent.innerHTML = `<option value="">— Top level (no parent) —</option>` +
    PAGES.filter(p=>p.parent===null).map(p=>`<option value="${p.id}">${escapeHtml(p.title)}</option>`).join("");
  if(currentId){
    const cur = getPage(currentId);
    const targetParent = cur && cur.parent === null ? cur.id : (cur ? cur.parent : "");
    if(targetParent) newPageParent.value = targetParent;
  }
  addModal.classList.add('show');
  newPageTitle.focus();
}
function closeAddModal(){ addModal.classList.remove('show'); }

document.getElementById('addPageBtn').addEventListener('click', openAddModal);
document.getElementById('cancelAddBtn').addEventListener('click', closeAddModal);
addModal.addEventListener('click', (e)=>{ if(e.target === addModal) closeAddModal(); });

document.getElementById('confirmAddBtn').addEventListener('click', ()=>{
  const title = newPageTitle.value.trim();
  if(!title){ newPageTitle.focus(); return; }
  const parent = newPageParent.value || null;
  const newId = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  PAGES.push({ id:newId, parent:parent, title:title, body:"<p>New page — click here in Edit mode to start writing.</p>" });
  renumberAll();
  savePages(true);
  closeAddModal();
  setEditMode(true);
  navigateTo(newId);
  showToast("Page created — start typing");
});

// ---------- EDIT MODE ----------
function setEditMode(on){
  editMode = on;
  document.body.classList.toggle('editing', on);
  document.getElementById('editToggle').classList.toggle('on', on);
  document.getElementById('saveStatus').textContent = on ? "Editing — click into title or body to type" : "";
  if(currentId) renderPage(currentId);
}
document.getElementById('editToggle').addEventListener('click', ()=> setEditMode(!editMode));

// ---------- SAVE / RESET / EXPORT ----------
document.getElementById('saveBtn').addEventListener('click', ()=> savePages(false));
document.getElementById('syncNowBtn').addEventListener('click', async ()=>{
  await pollForRemoteChanges();
  showToast("Checked for updates");
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm("Reset the ENTIRE wiki to its original pages? This affects everyone who opens this page — all edits and added/removed pages will be lost.")){
    localStorage.removeItem(LOCAL_FALLBACK_KEY);
    PAGES = JSON.parse(JSON.stringify(DEFAULT_PAGES));
    currentId = PAGES[0].id;
    renumberAll();
    savePages(true);
    renderTree(""); renderPage(currentId);
    showToast("Reset to original wiki for everyone");
  }
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const pagesJson = JSON.stringify(PAGES, null, 2);
  const fullHtml = document.documentElement.outerHTML
    .replace(/const DEFAULT_PAGES = [\s\S]*?\];\s*\n/, `const DEFAULT_PAGES = ${pagesJson};\n`);
  // Build a clean standalone export instead of relying on live DOM (safer)
  const template = EXPORT_TEMPLATE.replace("__PAGES_JSON__", pagesJson);
  const blob = new Blob([template], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = "kaneai-onboarding-wiki-updated.html"; a.click();
  URL.revokeObjectURL(url);
  showToast("Exported updated wiki as a new HTML file");
});

// ---------- SEARCH ----------
document.getElementById('searchInput').addEventListener('input', (e)=> renderTree(e.target.value));

// ---------- INIT ----------
// ---------- INIT (async, since loading may come from Supabase) ----------
async function initWiki(){
  PAGES = await loadPages();
  lastSyncedJson = JSON.stringify(PAGES);
  currentId = PAGES[0] ? PAGES[0].id : null;
  renderTree("");
  if(currentId) renderPage(currentId);
  if(SUPABASE_CONFIGURED){
    setInterval(pollForRemoteChanges, 15000); // check for others' edits every 15s
  }
}
initWiki();

// Template used for exporting a fully standalone copy (keeps this same app shell, swaps in current PAGES as the new default)
const EXPORT_TEMPLATE = document.documentElement.outerHTML.replace(
  /const DEFAULT_PAGES = [\s\S]*?\];(\s*\n)/,
  `const DEFAULT_PAGES = __PAGES_JSON__;$1`
);
</script>
